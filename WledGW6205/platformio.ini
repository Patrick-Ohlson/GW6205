; ─────────────────────────────────────────────────────────────────────
; WledGW6205 — WLED fork for the GW6205 12-bit LED chipset.
;
; Uses the vendored WLED sources at ../wled/wled00/ as src_dir, and
; adds our own lib/Gw6205Bus/ driver for 12-bit RMT output.
;
; The patched WLED source (const.h, bus_wrapper.h, bus_manager.cpp)
; activates its GW6205-only code paths when WLED_GW6205_ONLY is defined,
; stripping all non-GW6205 NeoPixelBus template instantiations from the
; final binary.
;
; To build (CLI):
;   cd ../wled && npm ci && npm run build && cd ../WledGW6205   # one-time
;   pio run                                                    # compile
;   pio run -t upload                                          # flash
;
; To build (VSCode):
;   Open WledGW6205/ as a workspace folder. The PlatformIO IDE extension
;   should pick up this file automatically. Use the PIO toolbar at the
;   bottom of the editor, or run the tasks defined in .vscode/tasks.json
;   (Ctrl+Shift+B → "PlatformIO: Build (wled_gw6205_esp32)").
;
; See README.md for upstream-sync procedure.
; ─────────────────────────────────────────────────────────────────────

[platformio]
; Compile WLED's source tree directly from its vendored location.
src_dir = ../wled/wled00
default_envs = wled_gw6205_esp32

; IMPORTANT: store all PIO build artifacts OUTSIDE the Dropbox-synced
; project tree. Dropbox aggressively rewrites file timestamps as it
; syncs, which makes PIO see "modified" libdeps/build files between
; runs and trigger an endless rebuild + package-redownload loop.
;
; %LOCALAPPDATA% on Windows is C:\Users\<user>\AppData\Local — a fast
; non-synced drive. Override via PLATFORMIO_WORKSPACE_DIR if you want
; a different location (or if you're on Linux/macOS, set it to
; ~/.cache/pio_wled_gw6205 or similar).
workspace_dir = ${sysenv.LOCALAPPDATA}/pio_wled_gw6205

; ─── WLED build scripts: disabled ───────────────────────────────────────
; Upstream WLED runs several Python pre/post scripts (set_metadata,
; load_usermods, build_ui, etc.) from its pio-scripts/ directory. We
; intentionally skip them all:
;   - set_metadata.py: WLED_VERSION has a fallback in wled_metadata.cpp,
;                      so building without it just emits a #warning.
;   - build_ui.py:     html_*.h must be generated manually with
;                      `cd ../wled && npm run build` once per upstream sync.
;   - load_usermods.py: this fork has no usermods.
;   - output_bins/strip-floats/dynarray: cosmetic post-processing only.
[scripts_local]
extra_scripts =

; ─── Common build flags — copied from wled/platformio.ini [common] ──────
; These are the compile-time switches WLED needs regardless of MCU.
[common_wled]
build_flags =
  -DMQTT_MAX_PACKET_SIZE=1024
  -DSECURE_CLIENT=SECURE_CLIENT_BEARSSL
  -DBEARSSL_SSL_BASIC
  -D CORE_DEBUG_LEVEL=0
  -D NDEBUG
  -Wno-attributes
  -D _IR_ENABLE_DEFAULT_=false
  -D DECODE_HASH=true
  -D DECODE_NEC=true
  -D DECODE_SONY=true
  -D DECODE_SAMSUNG=true
  -D DECODE_LG=true
  -D WLED_PS_DONT_REPLACE_FX

; ─── ESP32 platform — copied from wled/platformio.ini [esp32_idf_V4] ────
[esp32_idf_V4]
platform = https://github.com/tasmota/platform-espressif32/releases/download/2024.06.00/platform-espressif32.zip
platform_packages =
build_flags = -g
  -Wshadow=compatible-local
  -DARDUINO_ARCH_ESP32 -DESP32

; ─── WLED library dependencies (pinned to match wled/platformio.ini) ────
; NeoESP32RmtHI lives at lib/NeoESP32RmtHI/ as a local copy (vendored from
; ../wled/lib/NeoESP32RmtHI/). PIO auto-discovers it from lib_dir. We keep
; the copy local instead of using lib_extra_dirs or symlink:// because
; cross-PROJECT_DIR library discovery is unreliable on Windows. If the
; upstream library ever changes, re-run InstallPatches.bat to refresh it.
[wled_deps]
lib_deps =
  IRremoteESP8266 @ 2.8.2
  https://github.com/Makuna/NeoPixelBus.git#a0919d1c10696614625978dd6fb750a1317a14ce
  https://github.com/Aircoookie/ESPAsyncWebServer.git#v2.4.2
  marvinroger/AsyncMqttClient @ 0.9.0
  https://github.com/blazoncek/QuickESPNow.git#optional-debug

; ─── Our GW6205-only build environment ──────────────────────────────────
[env:wled_gw6205_esp32]
board = esp32dev
platform = ${esp32_idf_V4.platform}
framework = arduino
board_build.flash_mode = dio
board_build.partitions = ../wled/tools/WLED_ESP32_4MB_1MB_FS.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600

; lib_compat_mode = soft tolerates libraries (like NeoESP32RmtHI) whose
; library.json doesn't declare a `frameworks` field; strict would reject
; them and silently break the build.
lib_compat_mode = soft
; Recursively scan #includes from headers, not just .cpp files. Required
; because GW6205 references in bus_wrapper.h are reached via header chains.
lib_ldf_mode = deep+

build_flags = ${common_wled.build_flags} ${esp32_idf_V4.build_flags}
  -D WLED_RELEASE_NAME=\"ESP32_GW6205\"
  -D WLED_GW6205_ONLY=1
  -DARDUINO_USB_CDC_ON_BOOT=0
  ; Verbose serial logging during boot, WiFi connect, OTA, etc. Costs
  ; ~10 KB flash and a bit of stack. Comment out for production builds.
  ;-D WLED_DEBUG

build_unflags =

lib_deps = ${wled_deps.lib_deps}

extra_scripts = ${scripts_local.extra_scripts}
