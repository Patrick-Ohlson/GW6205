; PlatformIO Project Configuration
; GW6205 12-bit LED Test Firmware for ESP32
;
; Upload: pio run -t upload
; Monitor: pio device monitor
; Both:    pio run -t upload -t monitor

[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -D GW6205_DATA_PIN=16
    -D GW6205_NUM_LEDS=5
    -D TEST_BRIGHTNESS=0x0050

